apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Single source of truth for country flavors and their JS entry files (ADR-0002)
// Both productFlavors, debuggableVariants, and the release bundle task read from this map
ext.countryFlavors = [
    mx: [applicationId: "com.mexico.app", jsEntry: "index.mx", entryFile: "index.mx.js", activityName: "MexicoMainActivity"],
    cn: [applicationId: "com.zhongguo.app", jsEntry: "index.cn", entryFile: "index.cn.js", activityName: "ZhongguoActivity"],
]

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    debuggableVariants = project.ext.countryFlavors.collect { name, _ -> "${name}Debug" }
    /* Autolinking */
    autolinkLibrariesWithApp()
}

// Override entryFile for release bundle tasks based on the country flavor
afterEvaluate {
    tasks.matching { it.name.startsWith("createBundle") && it.name.endsWith("JsAndAssets") }.configureEach {
        def variantName = it.name.replace("createBundle", "").replace("JsAndAssets", "")
        def flavorName = variantName.replaceAll("(Debug|Release)", "").toLowerCase()
        def config = project.ext.countryFlavors[flavorName]
        if (config != null) {
            it.entryFile.set(file("../../${config.entryFile}"))
        }
    }
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.helloworld"
    defaultConfig {
        applicationId "com.helloworld"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions = ["country"]
    productFlavors {
        project.ext.countryFlavors.each { name, config ->
            "$name" {
                dimension "country"
                applicationId config.applicationId
                buildConfigField "String", "JS_ENTRY", "\"${config.jsEntry}\""
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
